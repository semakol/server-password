# The configuration phase needs to know who is connecting, and vanilla keeps the profile protected.
# NeoForge 21.1.243 fires no event that carries it: PlayerNegotiationEvent exists but nothing in
# NeoForge or Minecraft ever fires it (verified — zero references in the merged and universal jars),
# so reading it off the listener is the only reliable source.
public net.minecraft.server.network.ServerConfigurationPacketListenerImpl playerProfile()Lcom/mojang/authlib/GameProfile;
